<html><head><meta charset="utf-8"><title>DevTools</title>
<style>
:root { color-scheme: light; --line: #d9dde3; --bg: #ffffff; --bar: #f1f3f4; --sel: #cfe8fc; --hover: #eef3fb; --mono: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #202124; font: 12px system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100%; }
#bar { display: flex; align-items: stretch; height: 28px; flex: none; background: var(--bar); border-bottom: 1px solid var(--line); }
#bar button { border: 0; background: transparent; font: inherit; color: #3c4043; padding: 0 12px; height: 27px; cursor: default; }
#bar button:hover { background: #e3e6ea; }
#bar .tab.on { color: #1a73e8; box-shadow: inset 0 -2px #1a73e8; }
#bar .icon { width: 30px; padding: 0; font-size: 14px; }
#bar .icon.on { color: #1a73e8; background: #dbe7fb; }
#bar .sep { width: 1px; background: var(--line); margin: 5px 4px; }
#bar .grow { flex: 1; }
#bar .info { color: #5f6368; padding: 0 10px; line-height: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.panel { flex: 1; min-height: 0; display: none; }
.panel.on { display: flex; }
.mono { font-family: var(--mono); font-size: 12px; }
.scroll { overflow: auto; }
.split { display: flex; flex: 1; min-width: 0; min-height: 0; }
.side { width: 340px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.subbar { display: flex; align-items: center; gap: 6px; height: 26px; flex: none; border-bottom: 1px solid var(--line); padding: 0 6px; background: #fafbfc; }
.subbar input { font: inherit; height: 20px; border: 1px solid #c8ccd2; border-radius: 3px; padding: 0 6px; min-width: 0; }
.subbar button, .btn { font: inherit; height: 20px; border: 1px solid #c8ccd2; background: white; border-radius: 3px; padding: 0 8px; color: #3c4043; }
.subbar .tab2 { border: 0; background: transparent; height: 25px; border-radius: 0; }
.subbar .tab2.on { box-shadow: inset 0 -2px #1a73e8; color: #1a73e8; }
/* Elements */
#tree { flex: 1; min-width: 0; padding: 4px 0 30px 0; white-space: nowrap; }
.row { padding: 0 8px 0 0; line-height: 17px; cursor: default; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.tw { display: inline-block; width: 12px; color: #727272; font-size: 9px; text-align: center; }
.tag { color: #881280; }
.an { color: #994500; }
.av { color: #1a1aa6; }
.txt { color: #202124; }
.cmt { color: #236e25; }
.dt { color: #8a8a8a; }
#crumbs { height: 22px; flex: none; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; padding: 3px 6px; color: #444; background: #fafbfc; }
#crumbs span { padding: 0 4px; }
#crumbs span:hover { background: var(--hover); }
.rule { border-bottom: 1px solid #eceef1; padding: 4px 8px 6px 8px; }
.rule .sel { color: #202124; }
.rule .src { float: right; color: #5f6368; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rule .media { color: #5f6368; }
.decl { padding-left: 16px; white-space: pre-wrap; word-break: break-all; }
.decl .k { color: #c80000; }
.decl.over { text-decoration: line-through; opacity: 0.55; }
.ua { color: #5f6368; font-style: italic; }
.comp { display: flex; padding: 1px 8px; }
.comp .k { color: #c80000; width: 45%; flex: none; overflow: hidden; text-overflow: ellipsis; }
.comp .v { color: #202124; word-break: break-all; }
#boxm { margin: 10px auto; width: 300px; text-align: center; font-size: 10px; }
#boxm div { border: 1px dashed #888; padding: 2px 8px; position: relative; }
#boxm .lbl { position: absolute; left: 4px; top: 1px; color: #555; }
#boxm .m { background: #f9cc9d; } #boxm .b { background: #fddd9b; border-style: solid; border-color: #000; } #boxm .p { background: #c3d08b; } #boxm .c { background: #8cb6c0; padding: 6px; border-style: solid; border-color: #808080; }
#boxm .t, #boxm .bt { display: block; height: 14px; }
#boxm .mid { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.edit { width: 100%; height: 160px; font-family: var(--mono); font-size: 12px; border: 1px solid #c8ccd2; }
/* Console */
#console { flex-direction: column; }
#log { flex: 1; min-height: 0; }
.msg { border-bottom: 1px solid #f0f0f0; padding: 3px 8px 3px 22px; position: relative; white-space: pre-wrap; word-break: break-word; line-height: 16px; }
.msg::before { position: absolute; left: 7px; top: 3px; font-size: 10px; }
.msg.warn { background: #fffbe5; color: #5c3c00; border-color: #fff5c2; }
.msg.warn::before { content: "▲"; color: #e2a600; }
.msg.error { background: #fff0f0; color: #a50e0e; border-color: #ffd6d6; }
.msg.error::before { content: "✕"; color: #d93025; font-weight: bold; }
.msg.info::before { content: "ℹ"; color: #1a73e8; }
.msg.input { color: #1a73e8; }
.msg.input::before { content: "›"; font-size: 14px; top: 1px; color: #1a73e8; }
.msg.result::before { content: "‹·"; color: #9aa0a6; top: 3px; left: 4px; }
.msg.group { font-weight: bold; }
.msg .time { float: right; color: #9aa0a6; font-size: 11px; margin-left: 8px; }
.v-string { color: #c41a16; } .msg > .v-string.top { color: inherit; }
.v-number, .v-boolean, .v-bigint { color: #1a1aa6; }
.v-null, .v-undefined { color: #80868b; }
.v-symbol { color: #c41a16; }
.v-function { color: #13139c; font-style: italic; }
.v-node { color: #881280; text-decoration: underline dotted; cursor: pointer; }
.v-regexp { color: #c41a16; }
.obj > .head { cursor: default; }
.obj > .head .tw { width: 10px; }
.obj > .kids { padding-left: 14px; display: none; }
.obj.open > .kids { display: block; }
.prop .k { color: #881280; }
.prop .k.int { color: #5f6368; }
#prompt { display: flex; align-items: center; border-top: 1px solid var(--line); flex: none; min-height: 26px; }
#prompt span { color: #1a73e8; padding: 0 6px 0 9px; font-size: 14px; }
#prompt input { flex: 1; border: 0; outline: none; font-family: var(--mono); font-size: 12px; height: 24px; background: transparent; }
/* Sources */
#files { width: 260px; flex: none; border-right: 1px solid var(--line); }
.file { padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file:hover { background: var(--hover); }
.file.sel { background: var(--sel); }
.file .k { display: inline-block; width: 16px; color: #e8710a; font-weight: bold; }
.file .k.css { color: #1a73e8; } .file .k.doc { color: #5f6368; }
#code { flex: 1; min-width: 0; position: relative; }
#codeinner { position: relative; }
#codewin { position: absolute; left: 0; right: 0; }
.ln { white-space: pre; line-height: 16px; height: 16px; }
.ln .no { display: inline-block; width: 52px; padding-right: 10px; text-align: right; color: #9aa0a6; background: #f5f6f7; border-right: 1px solid #e3e5e8; margin-right: 8px; }
.kw { color: #aa0d91; } .str { color: #c41a16; } .com { color: #236e25; } .num { color: #1c00cf; }
/* Network */
#net { flex-direction: column; }
#nettable { flex: 1; min-height: 0; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; }
th { text-align: left; font-weight: normal; color: #5f6368; background: #f8f9fa; border-bottom: 1px solid var(--line); border-right: 1px solid #eceef1; padding: 3px 6px; position: sticky; top: 0; }
td { border-bottom: 1px solid #f1f2f4; border-right: 1px solid #f1f2f4; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr:hover td { background: var(--hover); }
tr.sel td { background: var(--sel); }
tr.fail td { color: #d93025; }
.wf { position: relative; height: 10px; }
.wf i { position: absolute; top: 1px; height: 8px; background: #1a73e8; border-radius: 1px; min-width: 2px; }
#netfoot { flex: none; border-top: 1px solid var(--line); padding: 4px 8px; color: #5f6368; background: #fafbfc; white-space: nowrap; overflow: hidden; }
#netdetail { flex: none; max-height: 40%; border-top: 1px solid var(--line); padding: 6px 10px; display: none; word-break: break-all; }
#netdetail b { display: inline-block; width: 110px; color: #5f6368; font-weight: normal; }
.empty { color: #80868b; padding: 16px; }
</style></head>
<body><div id="app">
<div id="bar">
  <button class="icon" id="pick" title="Select an element in the page to inspect it (Ctrl+Shift+C)">⬚</button>
  <div class="sep"></div>
  <button class="tab on" data-p="elements">Elements</button>
  <button class="tab" data-p="console">Console</button>
  <button class="tab" data-p="sources">Sources</button>
  <button class="tab" data-p="network">Network</button>
  <div class="grow"></div>
  <div class="info" id="pageurl"></div>
  <button class="icon" id="close" title="Close DevTools">✕</button>
</div>

<div class="panel on" id="elements">
  <div class="split" style="flex-direction:column">
    <div class="subbar"><input id="esearch" placeholder="Find by string or selector" style="flex:1"><span id="ehits" class="dt"></span><button id="eprev">▲</button><button id="enext">▼</button></div>
    <div id="tree" class="scroll mono"></div>
    <div id="crumbs" class="mono"></div>
  </div>
  <div class="side">
    <div class="subbar"><button class="tab2 on" data-s="styles">Styles</button><button class="tab2" data-s="computed">Computed</button><button class="tab2" data-s="html">Edit HTML</button></div>
    <div id="side-styles" class="scroll mono" style="flex:1"></div>
    <div id="side-computed" class="scroll mono" style="flex:1;display:none"></div>
    <div id="side-html" class="scroll" style="flex:1;display:none;padding:8px"></div>
  </div>
</div>

<div class="panel" id="console">
  <div class="subbar"><button id="cclear" title="Clear console">⊘</button><select id="clevel" style="font:inherit"><option value="all">All levels</option><option value="error">Errors</option><option value="warn">Warnings</option><option value="info">Info</option></select><input id="cfilter" placeholder="Filter" style="flex:1"></div>
  <div id="log" class="scroll mono"></div>
  <div id="prompt"><span>›</span><input id="cin" autocomplete="off" spellcheck="false"></div>
</div>

<div class="panel" id="sources">
  <div id="files" class="scroll"></div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="subbar"><span id="srcname" class="dt" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span><button id="pretty" title="Pretty-print">{ }</button></div>
    <div id="code" class="scroll mono"><div id="codeinner"><div id="codewin"></div></div></div>
  </div>
</div>

<div class="panel" id="network">
  <div class="split" style="flex-direction:column">
    <div class="subbar"><input id="nfilter" placeholder="Filter" style="width:200px"><select id="nkind" style="font:inherit"><option value="">All</option><option>document</option><option>script</option><option>stylesheet</option><option>image</option><option>font</option><option>fetch</option><option>iframe</option></select><div style="flex:1"></div><button id="nrefresh">Refresh</button></div>
    <div id="nettable" class="scroll"></div>
    <div id="netdetail" class="scroll mono"></div>
    <div id="netfoot"></div>
  </div>
</div>
</div>
<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const pending = new Map();
function call(method, params) {
  return new Promise((resolve) => {
    if (typeof ohbDevtools === 'undefined') { resolve({ error: 'not a DevTools page' }); return; }
    const id = ohbDevtools.send(method, params || {});
    if (id < 0) { resolve({ error: 'the inspected tab is gone' }); return; }
    pending.set(id, resolve);
  });
}
window.__ohb_devtools_client = function (json) {
  let m; try { m = JSON.parse(json); } catch (_) { return; }
  if (m.kind === 'response') { const r = pending.get(m.id); if (r) { pending.delete(m.id); r(m.result || {}); } }
  else if (m.kind === 'event' && m.event) onEvent(m.event);
};

// ---------------------------------------------------------------- tabs
let panel = 'elements';
function show(p) {
  panel = p;
  for (const b of document.querySelectorAll('#bar .tab')) b.classList.toggle('on', b.dataset.p === p);
  for (const d of document.querySelectorAll('.panel')) d.classList.toggle('on', d.id === p);
  if (p === 'sources') loadSources();
  if (p === 'network') loadNetwork();
  if (p === 'console') setTimeout(() => { $('#cin').focus(); scrollLogEnd(); }, 0);
}
for (const b of document.querySelectorAll('#bar .tab')) b.addEventListener('click', () => show(b.dataset.p));
$('#close').addEventListener('click', () => { call('detach'); ohbDevtools.close(); });
let picking = false;
function setPicking(on) { picking = on; $('#pick').classList.toggle('on', on); call('pick', { on }); if (on && panel !== 'elements') show('elements'); }
$('#pick').addEventListener('click', () => setPicking(!picking));

// ---------------------------------------------------------------- elements
const rows = new Map();   // node id -> { info, row, kids, open, loaded }
let selected = null;
function esc(s) { return String(s); }
function rowLabel(info, open) {
  const r = el('div', 'row');
  r.dataset.id = info.id;
  const tw = el('span', 'tw', info.n ? (open ? '▼' : '▶') : '');
  r.appendChild(tw);
  if (info.type === 1) {
    r.appendChild(el('span', 'tag', '<' + info.name));
    for (const [k, v] of info.attrs || []) {
      r.appendChild(document.createTextNode(' '));
      r.appendChild(el('span', 'an', k));
      if (v !== '') { r.appendChild(document.createTextNode('=')); r.appendChild(el('span', 'av', '"' + (v.length > 300 ? v.slice(0, 300) + '…' : v) + '"')); }
    }
    r.appendChild(el('span', 'tag', '>'));
    if (!open) {
      if (info.inlineText !== undefined) { r.appendChild(el('span', 'txt', info.inlineText)); r.appendChild(el('span', 'tag', '</' + info.name + '>')); }
      else if (info.n) { r.appendChild(el('span', 'dt', '…')); r.appendChild(el('span', 'tag', '</' + info.name + '>')); }
      else if (!/^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/.test(info.name)) r.appendChild(el('span', 'tag', '</' + info.name + '>'));
    }
  } else if (info.type === 3 || info.type === 4) r.appendChild(el('span', 'txt', '"' + info.text + '"'));
  else if (info.type === 8) r.appendChild(el('span', 'cmt', '<!--' + info.text + '-->'));
  else if (info.type === 10) r.appendChild(el('span', 'dt', '<!DOCTYPE ' + info.text + '>'));
  else if (info.type === 7) r.appendChild(el('span', 'cmt', '<?' + info.name + ' ' + info.text + '?>'));
  else r.appendChild(el('span', 'dt', info.name));
  return r;
}
function renderNode(info, depth) {
  const box = el('div');
  const st = { info, depth, box, open: false, loaded: false, kids: null, row: null, close: null };
  rows.set(info.id, st);
  st.row = rowLabel(info, false);
  st.row.style.paddingLeft = (depth * 14 + 4) + 'px';
  box.appendChild(st.row);
  return box;
}
function refreshRow(st) {
  const r = rowLabel(st.info, st.open);
  r.style.paddingLeft = (st.depth * 14 + 4) + 'px';
  if (selected === st.info.id) r.classList.add('sel');
  st.box.replaceChild(r, st.row);
  st.row = r;
}
async function expand(id, open) {
  const st = rows.get(id);
  if (!st || !st.info.n) return;
  if (open === st.open) return;
  st.open = open;
  if (open) {
    if (!st.loaded) {
      const res = await call('children', { node: id });
      st.kids = el('div');
      for (const k of res.nodes || []) st.kids.appendChild(renderNode(k, st.depth + 1));
      if (st.info.type === 1) { st.close = el('div', 'row'); st.close.style.paddingLeft = (st.depth * 14 + 16) + 'px'; st.close.appendChild(el('span', 'tag', '</' + st.info.name + '>')); }
      st.loaded = true;
    }
    st.box.appendChild(st.kids);
    if (st.close) st.box.appendChild(st.close);
  } else {
    if (st.kids && st.kids.parentNode) st.box.removeChild(st.kids);
    if (st.close && st.close.parentNode) st.box.removeChild(st.close);
  }
  refreshRow(st);
}
async function reloadChildren(id) {
  const st = rows.get(id);
  if (!st) return;
  const info = await call('node', { node: id });
  if (info.error) return;
  const wasOpen = st.open;
  if (st.kids && st.kids.parentNode) st.box.removeChild(st.kids);
  if (st.close && st.close.parentNode) st.box.removeChild(st.close);
  st.info = info; st.loaded = false; st.open = false; st.kids = null;
  refreshRow(st);
  if (wasOpen) await expand(id, true);
}
async function loadTree() {
  const tree = $('#tree');
  tree.textContent = '';
  rows.clear();
  const res = await call('children', { node: 0 });
  if (res.error) { tree.appendChild(el('div', 'empty', res.error)); return; }
  for (const k of res.nodes || []) tree.appendChild(renderNode(k, 0));
  const html = (res.nodes || []).find(n => n.type === 1);
  if (html) {
    await expand(html.id, true);
    const hs = rows.get(html.id);
    for (const c of (hs && hs.kids ? Array.from(hs.kids.children) : [])) { const id = +c.firstChild.dataset.id; const s = rows.get(id); if (s && s.info.name === 'body') { await expand(id, true); select(id, false); } }
  }
}
async function revealNode(id) {
  const res = await call('path', { node: id });
  if (!res.path) return;
  for (const a of res.path.slice(0, -1)) { if (!rows.has(a)) { if (a === 0) continue; break; } await expand(a, true); }
  if (rows.has(id)) { select(id, true); const st = rows.get(id); scrollRowIntoView(st.row); }
}
function scrollRowIntoView(r) {
  const tree = $('#tree');
  const top = r.offsetTop - tree.offsetTop;
  if (top < tree.scrollTop || top > tree.scrollTop + tree.clientHeight - 20) tree.scrollTop = Math.max(0, top - tree.clientHeight / 3);
}
function select(id, fromUser) {
  if (selected !== null && rows.has(selected)) rows.get(selected).row.classList.remove('sel');
  selected = id;
  const st = rows.get(id);
  if (st) st.row.classList.add('sel');
  call('select', { node: id });
  updateCrumbs(id);
  loadSide();
  if (fromUser) call('scrollIntoView', { node: id });
}
async function updateCrumbs(id) {
  const res = await call('path', { node: id });
  const c = $('#crumbs');
  c.textContent = '';
  for (const n of (res.path || []).slice(1)) {
    const st = rows.get(n);
    if (!st || st.info.type !== 1) continue;
    let label = st.info.name;
    for (const [k, v] of st.info.attrs || []) { if (k === 'id' && v) label += '#' + v; if (k === 'class' && v.trim()) label += '.' + v.trim().split(/\s+/).slice(0, 2).join('.'); }
    const s = el('span', '', label);
    s.addEventListener('click', () => { select(n, true); scrollRowIntoView(rows.get(n).row); });
    s.addEventListener('mouseenter', () => call('highlight', { node: n }));
    c.appendChild(s);
  }
}
$('#tree').addEventListener('click', (e) => {
  const r = e.target.closest('.row'); if (!r || !r.dataset.id) return;
  const id = +r.dataset.id;
  if (e.target.classList.contains('tw')) { const st = rows.get(id); expand(id, !(st && st.open)); return; }
  select(id, true);
});
$('#tree').addEventListener('dblclick', (e) => {
  const r = e.target.closest('.row'); if (!r || !r.dataset.id) return;
  const id = +r.dataset.id; const st = rows.get(id); if (st) expand(id, !st.open);
});
let lastHover = null;
$('#tree').addEventListener('mousemove', (e) => {
  const r = e.target.closest('.row'); const id = r && r.dataset.id ? +r.dataset.id : null;
  if (id !== lastHover) { lastHover = id; call('highlight', { node: id }); }
});
$('#tree').addEventListener('mouseleave', () => { lastHover = null; call('highlight', { node: null }); });
document.addEventListener('keydown', async (e) => {
  if (panel !== 'elements' || selected === null || (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) return;
  const st = rows.get(selected); if (!st) return;
  const visible = Array.from(document.querySelectorAll('#tree .row[data-id]'));
  const i = visible.indexOf(st.row);
  if (e.key === 'ArrowDown' && i + 1 < visible.length) { select(+visible[i + 1].dataset.id, true); scrollRowIntoView(visible[i + 1]); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && i > 0) { select(+visible[i - 1].dataset.id, true); scrollRowIntoView(visible[i - 1]); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { await expand(selected, true); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { if (st.open) await expand(selected, false); e.preventDefault(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    const path = await call('path', { node: selected });
    const parent = path.path && path.path.length > 1 ? path.path[path.path.length - 2] : null;
    await call('remove', { node: selected });
    if (parent !== null) { await reloadChildren(parent); select(parent, false); }
    e.preventDefault();
  }
});
// search
let hits = [], hitIdx = -1;
async function runSearch() {
  const q = $('#esearch').value;
  const res = await call('search', { query: q });
  hits = res.nodes || []; hitIdx = -1;
  $('#ehits').textContent = q ? (hits.length ? '0 of ' + hits.length : 'no matches') : '';
  if (hits.length) nextHit(1);
}
async function nextHit(d) {
  if (!hits.length) return;
  hitIdx = (hitIdx + d + hits.length) % hits.length;
  $('#ehits').textContent = (hitIdx + 1) + ' of ' + hits.length;
  await revealNode(hits[hitIdx]);
}
$('#esearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') { if (hits.length && hitIdx >= 0) nextHit(e.shiftKey ? -1 : 1); else runSearch(); } });
